<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610">
<defs>
  <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#5B6CF9">
      <animate attributeName="stop-color" values="#5B6CF9;#9B3FE8;#D44FD4;#E0399A;#5B6CF9" dur="8s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#D44FD4">
      <animate attributeName="stop-color" values="#D44FD4;#E0399A;#5B6CF9;#9B3FE8;#D44FD4" dur="8s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#5B6CF9"/>
    <stop offset="33%" stop-color="#9B3FE8"/>
    <stop offset="66%" stop-color="#D44FD4"/>
    <stop offset="100%" stop-color="#E0399A"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="30%" cy="20%" r="80%">
    <stop offset="0%" stop-color="#170D2E"/>
    <stop offset="100%" stop-color="#08050F"/>
  </radialGradient>
  <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#9B3FE8" stop-opacity="0"/>
    <stop offset="45%" stop-color="#9B3FE8" stop-opacity="0.05"/>
    <stop offset="50%" stop-color="#E9D5FF" stop-opacity="0.55"/>
    <stop offset="55%" stop-color="#9B3FE8" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#E0399A" stop-opacity="0"/>
  </linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#7C3AED" opacity="0.05"/>
  </pattern>
  <radialGradient id="sweepGrad" cx="258" cy="290" r="165" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#9B3FE8" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#9B3FE8" stop-opacity="0"/>
  </radialGradient>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <mask id="revealMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1180" height="620">
    <rect x="0" y="0" width="1180" height="0" fill="#fff">
      <animate attributeName="height" from="0" to="560" dur="2.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
  </mask>
  <clipPath id="lc0"><rect x="500" y="26.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="0.75s" fill="freeze"/></rect></clipPath><clipPath id="lc1"><rect x="500" y="50.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="0.86s" fill="freeze"/></rect></clipPath><clipPath id="lc2"><rect x="500" y="72.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="0.98s" fill="freeze"/></rect></clipPath><clipPath id="lc3"><rect x="500" y="94.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="1.09s" fill="freeze"/></rect></clipPath><clipPath id="lc4"><rect x="500" y="116.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="1.21s" fill="freeze"/></rect></clipPath><clipPath id="lc5"><rect x="500" y="138.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="1.32s" fill="freeze"/></rect></clipPath><clipPath id="lc6"><rect x="500" y="160.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="1.44s" fill="freeze"/></rect></clipPath><clipPath id="lc7"><rect x="500" y="182.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="1.55s" fill="freeze"/></rect></clipPath><clipPath id="lc8"><rect x="500" y="204.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="1.67s" fill="freeze"/></rect></clipPath><clipPath id="lc9"><rect x="500" y="226.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="1.78s" fill="freeze"/></rect></clipPath><clipPath id="lc10"><rect x="500" y="248.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="1.9s" fill="freeze"/></rect></clipPath><clipPath id="lc11"><rect x="500" y="270.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="2.02s" fill="freeze"/></rect></clipPath><clipPath id="lc12"><rect x="500" y="292.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="2.13s" fill="freeze"/></rect></clipPath><clipPath id="lc13"><rect x="500" y="314.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="2.25s" fill="freeze"/></rect></clipPath><clipPath id="lc14"><rect x="500" y="336.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="2.36s" fill="freeze"/></rect></clipPath><clipPath id="lc15"><rect x="500" y="358.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="2.48s" fill="freeze"/></rect></clipPath><clipPath id="lc16"><rect x="500" y="380.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="2.59s" fill="freeze"/></rect></clipPath><clipPath id="lc17"><rect x="500" y="402.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="2.71s" fill="freeze"/></rect></clipPath><clipPath id="lc18"><rect x="500" y="424.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="2.82s" fill="freeze"/></rect></clipPath><clipPath id="lc19"><rect x="500" y="446.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="2.94s" fill="freeze"/></rect></clipPath><clipPath id="lc20"><rect x="500" y="468.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="3.05s" fill="freeze"/></rect></clipPath><clipPath id="lc21"><rect x="500" y="490.00" width="0" height="24"><animate attributeName="width" from="0" to="690" dur="0.38s" begin="3.17s" fill="freeze"/></rect></clipPath>
  <style>
    .key    { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #A78BFA; font-weight: bold; }
    .value  { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #E5E7EB; }
    .cc     { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #4C4166; }
    .head   { font-family: 'Courier New', Consolas, monospace; font-size: 17px; fill: #D44FD4; font-weight: bold; }
    .accent { font-family: 'Courier New', Consolas, monospace; font-size: 15px; fill: #E0399A; font-weight: bold; }
    text, tspan { white-space: pre; }
    .term-label { font-family: 'Courier New', Consolas, monospace; font-size: 12px; fill: #6B7280; letter-spacing: 0.5px; }
    .scan-label { font-family: 'Courier New', Consolas, monospace; font-size: 10px; fill: #F87171; letter-spacing: 1px; }
    .panel-title { font-family: 'Courier New', Consolas, monospace; font-size: 11px; fill: #9B3FE8; letter-spacing: 2px; opacity: 0.75; }
    .cursor-blink { fill: #D44FD4; }
    .quote  { font-family: 'Courier New', Consolas, monospace; font-size: 13px; font-style: italic; fill: #A5A0C4; }
    .qsig   { font-family: 'Courier New', Consolas, monospace; font-size: 12px; font-style: italic; fill: #9B3FE8; }
    .boot   { font-family: 'Courier New', Consolas, monospace; font-size: 13px; }
  </style>
</defs>

<rect width="1180" height="610" rx="18" fill="url(#bgGlow)"/>
<rect width="1180" height="610" rx="18" fill="url(#scanlines)"/>

<g id="titlebar">
  <rect x="3" y="3" width="1174" height="34" rx="16" fill="#0B0714" fill-opacity="0.85"/>
  <circle cx="24" cy="20" r="5" fill="#EF4444"><animate attributeName="opacity" values="1;0.55;1" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="42" cy="20" r="5" fill="#F59E0B"><animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="20" r="5" fill="#10B981"><animate attributeName="opacity" values="1;0.55;1" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle>
  <text x="590" y="25" text-anchor="middle" class="term-label">jrcc@soc ~ % ./whoami.sh --live</text>
  <circle cx="1122" cy="20" r="4" fill="#F87171">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <text x="1132" y="24" class="scan-label">MONITORING</text>
</g>

<g transform="translate(0,38)">
  <rect x="14" y="26" width="488" height="468" rx="14" fill="#0B0714" fill-opacity="0.35" stroke="url(#borderGrad)" stroke-width="1" opacity="0.35"/>
  <rect x="508" y="10" width="655" height="500" rx="14" fill="#0B0714" fill-opacity="0.35" stroke="url(#borderGrad)" stroke-width="1" opacity="0.35"/>
  <text x="30" y="24" class="panel-title">IDENTITY.SIG</text>
  <text x="524" y="24" class="panel-title">SYSTEM.INFO</text>

  <!-- radar / scanning decoration, always live, sits behind the reveal content -->
  <g opacity="0.55">
    <circle cx="258" cy="290" r="60" fill="none" stroke="url(#borderGrad)" stroke-width="1" opacity="0.14"/>
    <circle cx="258" cy="290" r="112" fill="none" stroke="url(#borderGrad)" stroke-width="1" opacity="0.11"/>
    <circle cx="258" cy="290" r="165" fill="none" stroke="url(#borderGrad)" stroke-width="1" opacity="0.08"/>
    <line x1="93" y1="290" x2="423" y2="290" stroke="#7C3AED" stroke-width="1" opacity="0.08"/>
    <line x1="258" y1="125" x2="258" y2="455" stroke="#7C3AED" stroke-width="1" opacity="0.08"/>
    <path d="M258,290 L258,125 A165,165 0 0,1 396,213 Z" fill="url(#sweepGrad)" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 258 290" to="360 258 290" dur="6s" repeatCount="indefinite"/>
    </path>
    <circle cx="190" cy="230" r="3" fill="#D44FD4"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="360" r="3" fill="#5B6CF9"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="205" r="2.5" fill="#E0399A"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="380" r="2.5" fill="#9B3FE8"><animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>

  <g mask="url(#revealMask)">
    <!-- reused JRCC signature block-art, recoloured -->
    <text x="30" y="0" font-family="'Courier New', Consolas, monospace" font-weight="bold" font-size="15" fill="url(#asciiGrad)" filter="url(#softGlow)" xml:space="preserve">
      <tspan x="30" y="98">██      ██ ██████   ██████  ██████ </tspan>
      <tspan x="30" y="118"> ██     ██ ██   ██ ██      ██      </tspan>
      <tspan x="30" y="138">  ██    ██ ██████  ██      ██      </tspan>
      <tspan x="30" y="158"> ██  ██ ██ ██   ██ ██      ██      </tspan>
      <tspan x="30" y="178">██    ███  ██   ██  ██████  ██████ </tspan>
    </text>

    <text x="30" y="0" class="quote">
      <tspan x="30" y="222">"A shinobi knows the difference</tspan>
      <tspan x="30" y="242">between honor and victory."</tspan>
    </text>
    <text x="30" y="262" class="qsig">— Genichiro Ashina</text>

    <line x1="30" y1="284" x2="460" y2="284" stroke="#4C1D95" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>

    <text x="30" y="0" class="boot">
      <tspan x="30" y="308" fill="#5B6CF9" font-weight="bold">$ </tspan><tspan fill="#8B87A8">whoami</tspan>
      <tspan x="30" y="328" fill="#D44FD4" font-weight="bold">&gt; </tspan><tspan fill="#E5E7EB">jrcc — SOC Analyst N1</tspan>
      <tspan x="30" y="348" fill="#5B6CF9" font-weight="bold">$ </tspan><tspan fill="#8B87A8">status --check</tspan>
      <tspan x="30" y="368" fill="#D44FD4" font-weight="bold">&gt; </tspan><tspan fill="#E5E7EB">ONLINE </tspan><tspan fill="#E0399A">●</tspan><tspan fill="#E5E7EB"> learning and testing...</tspan>
    </text>
    <rect x="30" y="378" width="7" height="12" fill="#D44FD4">
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g clip-path="url(#lc0)"><text x="520" y="0" fill="#dbeafe"><tspan x="520" y="42" class="head">jrcc@soc</tspan><tspan class="cc"> -——————————————————————————————————————————-—-</tspan></text></g><g clip-path="url(#lc1)"><text x="520" y="0" fill="#dbeafe"><tspan x="520" y="66" class="cc">. </tspan><tspan class="key">Subject</tspan><tspan class="cc">: .................... </tspan><tspan class="value">José Renato Cardoso</tspan></text></g><g clip-path="url(#lc2)"><text x="520" y="0" fill="#dbeafe"><tspan x="520" y="88" class="cc">. </tspan><tspan class="key">Role</tspan><tspan class="cc">: ....................... </tspan><tspan class="value">SOC Analyst N1</tspan></text></g><g clip-path="url(#lc3)"><text x="520" y="0" fill="#dbeafe"><tspan x="520" y="110" class="cc">. </tspan><tspan class="key">Base</tspan><tspan class="cc">: ....................... </tspan><tspan class="value">Brasil</tspan></text></g><g clip-path="url(#lc4)"><text x="520" y="0" fill="#dbeafe"><tspan x="520" y="132" class="cc">. </tspan><tspan class="key">Education</tspan><tspan class="cc">: .................. </tspan><tspan class="value">Eng. Computação — UTFPR</tspan></text></g><g clip-path="url(#lc5)"><text x="520" y="0" fill="#dbeafe"><tspan x="520" y="154" class="cc">. </tspan><tspan class="key">Status</tspan><tspan class="cc">: ..................... </tspan><tspan class="value">Investigating • Defending • Building</tspan></text></g><g clip-path="url(#lc6)"><text x="520" y="0" fill="#dbeafe"><tspan x="520" y="176" class="cc">. </tspan><tspan class="key">Stack</tspan><tspan class="cc">.</tspan><tspan class="key">OS</tspan><tspan class="cc">: ................... </tspan><tspan class="value">Linux · Bash · Git</tspan></text></g><g clip-path="url(#lc7)"><text x="520" y="0" fill="#dbeafe"><tspan x="520" y="198" class="cc">. </tspan></text></g><g clip-path="url(#lc8)"><text x="520" y="0" fill="#dbeafe"><tspan x="520" y="220" class="cc">. </tspan><tspan class="key">Core</tspan><tspan class="cc">.</tsp